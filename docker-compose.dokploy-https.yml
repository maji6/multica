# Gongfeng-enabled Multica deployment with HTTP and HTTPS sharing port 3200.
# Wait for Gongfeng Images to finish before deploying in the same Dokploy application.
# Requires the existing acme.sh certificate installer on this host.
# Keep the router mapping unchanged; public webhooks use the existing FRP gateway.

services:
  multica-postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: multica
      POSTGRES_USER: multica
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the existing database password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U multica -d multica"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - default

  multica-api:
    image: ghcr.io/maji6/multica-backend:${MULTICA_IMAGE_TAG:-gongfeng-stable}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      multica-postgres:
        condition: service_healthy
    environment:
      MULTICA_LARK_SECRET_KEY: ${MULTICA_LARK_SECRET_KEY:?Set the existing Feishu credential encryption key}
      DATABASE_URL: postgres://multica:${POSTGRES_PASSWORD:?Set the existing database password}@multica-postgres:5432/multica?sslmode=disable
      PORT: "8080"
      APP_ENV: production
      JWT_SECRET: ${JWT_SECRET:?Set the existing JWT signing secret}

      # Keep HTTP session cookies usable on the LAN; Nginx adds Secure for HTTPS.
      FRONTEND_ORIGIN: "http://${MULTICA_LAN_IP:?Set the server LAN IPv4}:${MULTICA_PORT:-3200}"
      MULTICA_APP_URL: "https://multica.savetest.top:3200"
      MULTICA_DAEMON_SERVER_URL: "https://multica.savetest.top:3200"
      CORS_ALLOWED_ORIGINS: "http://${MULTICA_LAN_IP:?Set the server LAN IPv4}:${MULTICA_PORT:-3200},http://112.5.69.112:3200,http://multica.savetest.top:3200,https://multica.savetest.top:3200,https://multica.savetest.top"

      # Public callback origin routed through the existing FRP gateway.
      MULTICA_PUBLIC_URL: "https://hooks.savetest.top"

      COOKIE_DOMAIN: ""
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      DISABLE_WORKSPACE_CREATION: ${DISABLE_WORKSPACE_CREATION:-false}

      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_TLS: ${SMTP_TLS:-}

      MULTICA_VCS_INTEGRATION_ENABLED: "true"
      MULTICA_VCS_SECRET_KEY: ${MULTICA_VCS_SECRET_KEY:?Set the existing base64-encoded 32-byte key}
      DO_NOT_TRACK: "1"
    volumes:
      - backend_uploads:/app/data/uploads
    expose:
      - "8080"
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/readyz]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 12
    networks:
      - default
      - savereview

  multica-web:
    image: ghcr.io/maji6/multica-web:${MULTICA_IMAGE_TAG:-gongfeng-stable}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      multica-api:
        condition: service_healthy
    environment:
      HOSTNAME: "0.0.0.0"
      REMOTE_API_URL: http://multica-api:8080
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_WS_URL: ""
    expose:
      - "3000"
    networks:
      - default

  multica-gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      multica-web:
        condition: service_started
        restart: true
      multica-api:
        condition: service_healthy
        restart: true
    ports:
      - "${MULTICA_BIND_IP:-0.0.0.0}:${MULTICA_PORT:-3200}:3200"
    volumes:
      - type: bind
        source: /opt/multica-acme/incoming
        target: /etc/nginx/tls
        read_only: true
        bind:
          create_host_path: false
    configs:
      - source: multica_nginx_main
        target: /etc/nginx/nginx.conf
      - source: multica_nginx
        target: /etc/nginx/conf.d/default.conf
      - source: multica_cert_reload
        target: /etc/nginx/multica-cert-reload.sh
    command:
      - /bin/sh
      - -ec
      - |
        nginx -t
        /bin/sh /etc/nginx/multica-cert-reload.sh &
        exec nginx -g 'daemon off;'
    networks:
      - default
      - dokploy-network

configs:
  multica_nginx_main:
    content: |
      user nginx;
      worker_processes auto;
      error_log /var/log/nginx/error.log warn;
      pid /var/run/nginx.pid;

      events {
        worker_connections 1024;
      }

      stream {
        map $$ssl_preread_protocol $$multica_upstream {
          ''      127.0.0.1:8081;
          default 127.0.0.1:8443;
        }
        server {
          listen 3200;
          ssl_preread on;
          proxy_pass $$multica_upstream;
          proxy_protocol on;
          proxy_connect_timeout 10s;
          proxy_timeout 3600s;
        }
      }

      http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        sendfile on;
        keepalive_timeout 65;
        include /etc/nginx/conf.d/*.conf;
      }

  multica_nginx:
    content: |
      map $$http_upgrade $$multica_connection {
        default upgrade;
        '' close;
      }

      # Only the private Traefik listener may supply the external scheme.
      map "$$server_port:$$http_x_forwarded_proto" $$multica_scheme {
        "80:https" https;
        default $$scheme;
      }
      map $$multica_scheme $$multica_cookie_secure {
        https secure;
        default nosecure;
      }

      server {
        listen 80;
        listen 127.0.0.1:8081 proxy_protocol;
        listen 127.0.0.1:8443 ssl proxy_protocol;
        set_real_ip_from 127.0.0.1;
        real_ip_header proxy_protocol;
        server_name multica.savetest.top;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:MulticaTLS:10m;
        access_log off;
        client_max_body_size 64m;

        proxy_http_version 1.1;
        proxy_set_header Host $$http_host;
        proxy_set_header X-Forwarded-Host $$http_host;
        proxy_set_header X-Forwarded-Proto $$multica_scheme;
        proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $$http_upgrade;
        proxy_set_header Connection $$multica_connection;
        proxy_cookie_flags ~^multica_(auth|csrf|csrf_session)$ $$multica_cookie_secure;

        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;

        location ^~ /api/webhooks/vcs/ {
          proxy_pass http://multica-api:8080;
        }

        location ~ ^/(ws(?:/.*)?|api/daemon/ws|health|readyz|healthz)$ {
          proxy_pass http://multica-api:8080;
        }

        location / {
          proxy_pass http://multica-web:3000;
        }
      }

  multica_cert_reload:
    content: |
      #!/bin/sh
      set -eu
      cert=/etc/nginx/tls/fullchain.pem
      key=/etc/nginx/tls/privkey.pem
      last=$$(sha256sum "$$cert" "$$key")
      # acme.sh updates the mounted directory; a successful check precedes every reload.
      while sleep "$${MULTICA_CERT_RELOAD_INTERVAL:-60}"; do
        if ! current=$$(sha256sum "$$cert" "$$key"); then
          echo 'Multica: unable to read renewed TLS files; keeping the loaded certificate.' >&2
          continue
        fi
        if [ "$$current" != "$$last" ]; then
          if nginx -t && nginx -s reload; then
            last=$$current
            echo 'Multica: renewed TLS certificate reloaded.'
          else
            echo 'Multica: TLS reload failed; keeping the loaded certificate and retrying.' >&2
          fi
        fi
      done

volumes:
  pgdata:
  backend_uploads:

networks:
  default:
  dokploy-network:
    external: true
  savereview:
    external: true
    name: ${SAVEREVIEW_NETWORK:-savereview-app-yohdpq_default}
